version: '3'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: beacon-dashboard-backend
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/app
    environment:
      - PORT=8080
      
  jupyter:
    image: jupyter/all-spark-notebook:latest
    container_name: beacon-dashboard-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - duckdb_data:/home/jovyan/duckdb_data
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_DRIVER_MEMORY=8g
      - SPARK_EXECUTOR_MEMORY=8g
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - WAREHOUSE=${WAREHOUSE}
      - TOKEN=${TOKEN}
      - CATALOG_URI=${CATALOG_URI}
      - R2_TOKEN=${R2_TOKEN}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_CLICKSTREAM_BUCKET=${R2_CLICKSTREAM_BUCKET}
    command: start-notebook.sh --NotebookApp.token=''
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

  superset:
    image: apache/superset:latest
    container_name: beacon-dashboard-superset
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_ADMIN_USERNAME=${SUPERSET_ADMIN_USERNAME:-admin}
      - SUPERSET_ADMIN_EMAIL=${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-admin}
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
      --username $$SUPERSET_ADMIN_USERNAME
      --firstname Beacon
      --lastname Admin
      --email $$SUPERSET_ADMIN_EMAIL
      --password $$SUPERSET_ADMIN_PASSWORD || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "

volumes:
  duckdb_data:
  superset_home:
